name: security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  
jobs: 
    codeql: 
        runs-on: ubuntu-latest
        permissions:
            actions: read
            security-events: write
        steps:
          - uses: actions/checkout@v4
          - uses: github/codeql-action/init@v4
            
    trivy:
        runs-on: ubuntu-latest 
        steps:
          - uses: actions/checkout@v4
          - name: Run Trivy filesystem scan
            uses: aquasecurity/trivy-action@57a57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
            with:
              scan-type: 'fs'
              scan-ref: .
              severity: HIGH,CRITICAL
              ignore-unifixed: true
              exit-code: '1'